<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E55913"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Almoxarifado Usinara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra lateral escura (navy) + área de trabalho clara; no celular a barra vira gaveta */
:root{
  --bg:#F7F5EE; --surface:#fff; --surface2:#F1EEE4; --border:#E8E5DD; --fg:#0F172A; --fg2:#64748B; --fg3:#94A3B8;
  --accent:#E55913; --accent-d:#C2410C; --accent-bg:#FFF3EB; --on-accent:#fff;
  --nav:#131D2A; --nav2:#223044; --nav-fg:#CBD5E1;
  --ok:#15803D; --ok-bg:#E6F7ED; --warn:#C2410C; --warn-bg:#FEF3E8; --info:#0369A1; --info-bg:#E0F2FE;
  --trans:#2563EB; --trans-bg:#DBEAFE; --bad:#BE123C; --bad-bg:#FFE4E6; --neutral:#475569; --neutral-bg:#F1F5F9;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Space Grotesk','Inter',system-ui,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1621; --surface:#172131; --surface2:#1E2B3E; --border:#2A384D; --fg:#E7ECF3; --fg2:#9AA8BC; --fg3:#6B7A90;
  --accent:#FF7A3D; --accent-d:#FF9460; --accent-bg:#3A2418; --on-accent:#1a0e06;
  --nav:#0A111A; --nav2:#1B2738; --nav-fg:#B6C2D2;
  --ok:#4ADE80; --ok-bg:#12301F; --warn:#FDA066; --warn-bg:#3A2415; --info:#5CC2F2; --info-bg:#0E2C40;
  --trans:#7FA8FF; --trans-bg:#1A2B52; --bad:#FB7185; --bad-bg:#3D1620; --neutral:#B6C2D2; --neutral-bg:#233046;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1621; --surface:#172131; --surface2:#1E2B3E; --border:#2A384D; --fg:#E7ECF3; --fg2:#9AA8BC; --fg3:#6B7A90;
  --accent:#FF7A3D; --accent-d:#FF9460; --accent-bg:#3A2418; --on-accent:#1a0e06;
  --nav:#0A111A; --nav2:#1B2738; --nav-fg:#B6C2D2;
  --ok:#4ADE80; --ok-bg:#12301F; --warn:#FDA066; --warn-bg:#3A2415; --info:#5CC2F2; --info-bg:#0E2C40;
  --trans:#7FA8FF; --trans-bg:#1A2B52; --bad:#FB7185; --bad-bg:#3D1620; --neutral:#B6C2D2; --neutral-bg:#233046;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;padding-left:0;padding-right:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.side .brand{padding:6px 8px 16px;display:flex;flex-direction:column;gap:6px}
.side .brand .logo{background:#fff;border-radius:8px;padding:6px 10px;width:max-content}
.side .brand .logo img{height:30px;display:block}
.side .brand small{color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;text-align:left;width:100%}
.nav-btn:hover{background:var(--nav2)}
.nav-btn[aria-current="page"]{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn svg{flex:none}
.nav-badge{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px;font-size:11px;font-weight:600}
.side .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.top .menu{display:none}
.top h1{font:600 18px var(--head);margin:0;flex:1;min-width:120px}
.content{flex:1;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-d)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;color:var(--fg2);display:inline-flex}
.icon-btn:hover{background:var(--surface2)}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--fg2);min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2,.sec-title{font:600 15px var(--head);margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.metrics{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.metric b{display:block;font:600 28px var(--head);font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--fg2)}
.metric.k-ok b{color:var(--ok)}.metric.k-warn b{color:var(--warn)}.metric.k-info b{color:var(--info)}.metric.k-bad b{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.s-DISPONIVEL{background:var(--ok-bg);color:var(--ok)}.s-EMPRESTADO{background:var(--warn-bg);color:var(--warn)}
.s-EM_CONSERTO{background:var(--info-bg);color:var(--info)}.s-EM_TRANSITO{background:var(--trans-bg);color:var(--trans)}
.s-BAIXADO,.s-BAIXADO_FORNECEDOR{background:var(--bad-bg);color:var(--bad)}.s-neutral{background:var(--neutral-bg);color:var(--neutral)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .main-c{flex:1;min-width:180px}
.row .t{font-weight:600}.row .sub{font-size:12px;color:var(--fg2)}
.code{font-family:var(--mono);background:var(--surface2);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.late{color:var(--bad);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--fg2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2);padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover{background:var(--surface2)}
.modal-bg{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%)}
.modal header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:8px}
.modal header h3{margin:0;font:600 16px var(--head);flex:1}
.modal .body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.err{background:var(--bad-bg);color:var(--bad);padding:8px 10px;border-radius:8px;font-weight:500}
.hint{background:var(--info-bg);color:var(--info);padding:8px 10px;border-radius:8px;font-size:12.5px}
pre.doc{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;font:12px/1.5 var(--mono);overflow-x:auto;white-space:pre;margin:0}
.sigbox{border:1px dashed var(--fg3);border-radius:8px;background:#fff;touch-action:none;display:block;width:100%;height:150px}
.sigprev{background:#fff;border-radius:6px;border:1px solid var(--border);height:46px;width:130px;color:#1e293b}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.cart{display:flex;flex-direction:column;gap:6px}
.cart-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.cart-item .t{flex:1;min-width:140px;font-weight:600}
.tag-input{font:600 22px var(--mono);letter-spacing:.04em;padding:12px 14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tag-area{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:flex-start}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,264px)}
.keypad button{font:600 22px var(--mono);padding:14px 0;border:1px solid var(--border);background:var(--surface);border-radius:10px;touch-action:manipulation}
.keypad button:active{background:var(--accent-bg)}
.keypad .kx{font:600 14px var(--font);color:var(--fg2)}
.sug{flex:1;min-width:min(100%,280px);display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.sug-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;flex-wrap:wrap}
.sug-i:hover:not([disabled]){border-color:var(--accent);background:var(--accent-bg)}
.sug-i[disabled]{opacity:.55;cursor:not-allowed}
.sug-i .t{flex:1;min-width:140px;font-weight:600}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
  .top .menu{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FR={'½':'1/2','⅓':'1/3','⅔':'2/3','¼':'1/4','¾':'3/4','⅕':'1/5','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[½⅓⅔¼¾⅕⅛⅜⅝⅞]/g,c=>' '+FR[c]).replace(/[\u201c\u201d\u2033"'\u2019\u2032]/g,' ').replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim();
const hit=(q,...f)=>{const t=norm(q).split(' ').filter(Boolean);if(!t.length)return true;const h=' '+f.map(norm).join(' | ');return t.every(x=>h.includes(x))};
const P=n=>String(n).padStart(2,'0');
const dtf=t=>{const d=new Date(t);return `${P(d.getDate())}/${P(d.getMonth()+1)}/${d.getFullYear()} ${P(d.getHours())}:${P(d.getMinutes())}`};
const df=t=>{const d=new Date(t);return `${P(d.getDate())}/${P(d.getMonth()+1)}/${d.getFullYear()}`};
const stamp=(t,s=false)=>{const d=new Date(t);return `${d.getFullYear()}${P(d.getMonth()+1)}${P(d.getDate())}-${P(d.getHours())}${P(d.getMinutes())}${s?P(d.getSeconds()):''}`};
const startOfDay=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

/* ====================== dados ====================== */
let DB=null,saveT=null,idbOK=true;
function normalize(d,keep){
  const now=Date.now(),movs=(d.movs||d.movimentacoes||[]).map(m=>Object.assign({condicao:'Bom',observacoes:'',documentoRef:'',origem:'',destino:''},m));
  let mx=0;movs.forEach(m=>{if(typeof m.id==='number')mx=Math.max(mx,m.id)});movs.forEach(m=>{if(typeof m.id!=='number')m.id=++mx});
  movs.sort((x,y)=>y.dataHora-x.dataHora);
  const al=d.alugados||d.itensAlugados;
  return {v:2,nextId:mx+1,ferramentas:d.ferramentas||[],caixas:d.caixas||[],movs,
    funcs:(d.funcs||d.funcionarios||[]).map(f=>Object.assign({cargo:'',setor:'',assinaturaSvg:'',dataCadastro:now},f)),
    alugados:Array.isArray(al)?al:(keep||[])}}
function seed(){return normalize(JSON.parse(JSON.stringify(BACKUP)),[])}
function openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open('almoxarifado_usinara',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(){const db=await openIDB();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(v){const db=await openIDB();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'db');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function load(){
  try{DB=await idbGet()}catch(e){idbOK=false;try{DB=JSON.parse(localStorage.getItem('almox_db')||'null')}catch(_){}}
  if(!DB||DB.v!==2){DB=seed();save(true)}
}
function save(now){cloudTouch();clearTimeout(saveT);const run=async()=>{const copy=JSON.parse(JSON.stringify(DB));try{if(idbOK)await idbSet(copy);else localStorage.setItem('almox_db',JSON.stringify(copy))}catch(e){try{localStorage.setItem('almox_db',JSON.stringify(copy))}catch(_){}}};if(now)run();else saveT=setTimeout(run,150)}
function commit(){save();render()}

const W=55,LN='═'.repeat(W),LS='─'.repeat(W);
function docBuild(o){
  const L=[LN,'           USINARA INDUSTRIAL - CONTROLE DE ATIVOS',...o.titulo.map(t=>'      '+t),LN];
  o.campos.forEach(([k,v])=>L.push(`${k.padEnd(13)}: ${v}`));
  L.push(LS);
  (o.blocos||[]).forEach(b=>{L.push(b.titulo);b.linhas.forEach(l=>L.push(l));if(b.espaco)L.push('')});
  if(o.obs)L.push('','OBSERVAÇÕES: '+o.obs);
  L.push(LS);(o.fim||[]).forEach(l=>L.push(l));L.push(LN);return L.join('\n')
}

function textoInventario(almox){
  const L=[LN,'           USINARA INDUSTRIAL - CONTROLE DE ATIVOS','              RELATÓRIO DE INVENTÁRIO ATUAL',LN,'DATA / HORA  : '+dtf(Date.now()),'ALMOXARIFADO : '+(almox==='Todos'?'Todos':almox),LS];
  const fs=DB.ferramentas.filter(f=>almox==='Todos'||f.localizacao===almox),cs=DB.caixas.filter(c=>almox==='Todos'||c.localizacao===almox);
  const cnt=k=>fs.filter(f=>f.status===k).length;
  L.push(`FERRAMENTAS: ${fs.length} | Disponíveis ${cnt('DISPONIVEL')} | Emprestadas ${cnt('EMPRESTADO')} | Em conserto ${cnt('EM_CONSERTO')} | Baixadas ${cnt('BAIXADO')}`,`CAIXAS: ${cs.length}`,LS,'CAIXAS DE FERRAMENTAS:');
  cs.forEach(c=>{const n=fs.filter(f=>f.caixaCodigo===c.codigo).length;L.push(` • [${c.codigo}] ${c.nome} - ${ST[c.status]} - ${n} peças${c.responsavelAtual?' - com '+c.responsavelAtual:''}`)});
  L.push(LS,'FERRAMENTAS AVULSAS:');
  fs.filter(f=>!f.caixaCodigo).forEach(f=>L.push(` • [${f.codigo}] ${f.nome} - ${ST[f.status]} - ${f.condicao}${f.responsavelAtual?' - com '+f.responsavelAtual:''}`));
  const al=DB.alugados.filter(a=>almox==='Todos'||a.localizacao===almox);
  if(al.length){L.push(LS,'ITENS ALUGADOS:');al.forEach(a=>L.push(` • [${a.codigo}] ${a.nome} - ${ST[a.status]} - ${a.fornecedor}${a.responsavelAtual?' - com '+a.responsavelAtual:''}`))}

function sigPad(container,initial){
  container.innerHTML=`<canvas class="sigbox" width="600" height="300"></canvas><div class="toolbar" style="margin-top:6px"><button class="btn sm" type="button" data-clr>Limpar</button><span class="sub">Assine com o dedo ou o mouse</span></div>`;
  const cv=container.querySelector('canvas'),ctx=cv.getContext('2d');let strokes=[],cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*300,(e.clientY-r.top)/r.height*150]};
  const draw=()=>{ctx.clearRect(0,0,600,300);ctx.lineWidth=5;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle='#1e293b';
    if(!strokes.length&&initial){ctx.save();ctx.scale(2,2);ctx.globalAlpha=.25;ctx.stroke(new Path2D(initial));ctx.restore()}
    strokes.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0]*2,p[1]*2):ctx.moveTo(p[0]*2,p[1]*2));if(s.length===1)ctx.lineTo(s[0][0]*2+.1,s[0][1]*2);ctx.stroke()})};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);draw()});
  cv.addEventListener('pointermove',e=>{if(cur){cur.push(pt(e));draw()}});
  const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

  return {get:()=>strokes.length?strokes.map(s=>{let d='';let last=null;s.forEach((p,i)=>{if(!i||Math.hypot(p[0]-last[0],p[1]-last[1])>1.2){d+=(i?' L ':'M ')+p[0].toFixed(1)+' '+p[1].toFixed(1);last=p}});if(s.length===1)d+=` L ${(s[0][0]+.5).toFixed(1)} ${s[0][1].toFixed(1)}`;return d}).join(' '):initial||''}
}

/* ---------- Terminal TAG ---------- */
function resolveTag(raw,mode){
  const tag=raw.trim();if(!tag)return null;
  const c=getC(tag),f=getF(tag),a=getA(tag);
  const it=c?{tipo:'CAIXA',o:c}:f?{tipo:'FERRAMENTA',o:f}:a?{tipo:'ALUGADO',o:a}:null;
  if(!it){
    if(mode==='DEV'){const p=perifPend().find(m=>m.itemCodigo.toLowerCase()===tag.toLowerCase());if(p)return {tipo:'PERIFERICO',codigo:p.itemCodigo,nome:p.itemNome,resp:p.responsavel,qtd:(p.observacoes.match(/Qtd: (\S+)/)||[])[1]||'1'}}
    throw new Error(`Nenhum item com a TAG "${tag}".`)}
  const o=it.o;
  if(it.tipo==='FERRAMENTA'&&o.caixaCodigo)throw new Error(`A ferramenta ${o.codigo} pertence à caixa ${o.caixaCodigo}. Use a TAG da caixa.`);
  if(mode==='EMP'){if(o.status!=='DISPONIVEL')throw new Error(`${o.codigo} não está disponível (${ST[o.status]}${o.responsavelAtual?' - com '+o.responsavelAtual:''}).`)}
  else if(o.status!=='EMPRESTADO')throw new Error(`${o.codigo} não está emprestado (${ST[o.status]}).`);
  return {tipo:it.tipo,codigo:o.codigo,nome:o.nome,cond:o.condicao,resp:o.responsavelAtual}
}
function tagCands(q,mode){
  const t=String(q).trim();if(!t)return [];const nq=norm(t),num=/^\d+$/.test(nq);
  const rows=[];const add=(tipo,o)=>{const code=norm(o.codigo);let r;
    if(code.startsWith(nq))r=0;else if(code.includes(nq))r=1;else if(!num&&hit(t,o.codigo,o.nome))r=2;else return;
    rows.push({r,tipo,codigo:o.codigo,nome:o.nome,status:o.status,resp:o.responsavelAtual,caixa:o.caixaCodigo,loc:o.localizacao})};
  DB.ferramentas.forEach(f=>add('FERRAMENTA',f));DB.caixas.forEach(c=>add('CAIXA',c));DB.alugados.forEach(a=>add('ALUGADO',a));
  if(mode==='DEV')perifPend().forEach(m=>add('PERIFERICO',{codigo:m.itemCodigo,nome:m.itemNome,status:'EMPRESTADO',responsavelAtual:m.responsavel}));
  const ok=x=>!x.caixa&&(mode==='EMP'?x.status==='DISPONIVEL':x.status==='EMPRESTADO');
  return rows.filter(x=>mode==='EMP'||x.status==='EMPRESTADO').sort((a,b)=>a.r-b.r||(ok(b)-ok(a))||a.codigo.localeCompare(b.codigo,'pt',{numeric:true})).slice(0,40).map(x=>Object.assign(x,{ok:ok(x)}))}
function sugHTML(){

  return l.map(x=>`<button type="button" class="sug-i" data-sug="${esc(x.codigo)}" ${x.ok?'':'disabled'}><span class="code">${esc(x.codigo)}</span><span class="t">${esc(x.nome)}</span><span class="sub">${x.tipo.toLowerCase()}${x.caixa?' · na caixa '+esc(x.caixa):''}${x.resp?' · com '+esc(x.resp):''}</span>${pill(x.status)}</button>`).join('')}

/* ---------- Movimentações ---------- */
VIEWS.mov=()=>{
  const now=Date.now(),t0=startOfDay(),q=ui.buscaMov;
  const per={'HOJE+':m=>m.dataHora>=t0,HOJE:m=>m.dataHora>=t0&&m.dataHora<t0+864e5,'7D':m=>m.dataHora>=now-7*864e5,ALL:()=>true}[ui.periodo];
  const l=DB.movs.filter(m=>per(m)&&(ui.almox==='Todos'||m.origem.includes(ui.almox)||m.destino.includes(ui.almox)||true)&&hit(q,m.itemNome,m.itemCodigo,m.responsavel,m.documentoRef,m.tipo,m.observacoes));
  return `<div class="card"><div class="toolbar"><input class="grow" id="buscaMov" placeholder="Buscar item, responsável ou documento" value="${esc(ui.buscaMov)}"><button class="btn danger" id="resetMov">Limpar histórico…</button></div><div style="margin:10px 0">${chips([['HOJE+','A partir de hoje'],['HOJE','Hoje'],['7D','Últimos 7 dias'],['ALL','Todas']],ui.periodo,'per')}</div>${movTable(l)}<div class="sub" style="margin-top:8px">${l.length} registro(s). Toque em uma linha para ver o documento.</div></div>`};
ACT.mov=()=>{inputBind('buscaMov','buscaMov');bind('[data-per]','click',b=>{ui.periodo=b.dataset.per;render()});bind('[data-mov]','click',b=>showMov(DB.movs.find(m=>m.id==b.dataset.mov)));
  $('#resetMov').onclick=()=>{const m=modal('Limpar histórico','<p style="margin:0">Escolha o que remover. O estado atual dos itens não muda.</p>',`<button class="btn" data-x>Cancelar</button><button class="btn danger" id="r1">Só anteriores a hoje</button><button class="btn danger" id="r2">Tudo</button>`);m.querySelector('[data-x]').onclick=()=>m.remove();m.querySelector('#r1').onclick=()=>{DB.movs=DB.movs.filter(x=>x.dataHora>=startOfDay());m.remove();commit()};m.querySelector('#r2').onclick=()=>{DB.movs=[];m.remove();commit()}}};

/* ---------- Caixas ---------- */
VIEWS.caixas=()=>{const q=ui.cxBusca.trim();
  const l=DB.caixas.map(c=>{const t=DB.ferramentas.filter(f=>f.caixaCodigo===c.codigo),th=q?t.filter(f=>hit(q,f.codigo,f.nome,f.categoria,f.observacoes)):[];return {c,t,th,own:hit(q,c.codigo,c.nome,c.responsavelAtual,c.observacoes,'caixa '+c.codigo)}}).filter(x=>(ui.almox==='Todos'||x.c.localizacao===ui.almox)&&(!q||x.own||x.th.length));
  const np=l.reduce((n,x)=>n+x.th.length,0);
  return `<div class="toolbar"><input class="grow" id="cxBusca" placeholder="Buscar caixa ou peça dentro das caixas (ex.: 9/16, chave 1/2, 559)" value="${esc(ui.cxBusca)}"><button class="btn pri" id="newCx">+ Nova caixa</button></div>
  <div class="sub">${q?`${l.length} caixa(s) com resultado · ${np} peça(s) encontrada(s)`:`${l.length} caixa(s) de ferramentas`}</div>
  <div class="grid">${l.map(({c,t,th})=>`<div class="card"><div class="toolbar"><span class="code">${esc(c.codigo)}</span><b class="grow">${esc(c.nome)}</b>${pill(c.status)}</div>
   <div class="sub" style="margin:8px 0">${esc(c.localizacao)} · ${t.length} peças · ${esc(c.condicao)}${c.responsavelAtual?` · com <b>${esc(c.responsavelAtual)}</b>`:''}${c.status==='EMPRESTADO'&&c.dataPrevisaoRetorno?` · retorno ${prazo(c.dataPrevisaoRetorno,c.status)}`:''}</div>
   ${th.length?`<div style="margin-bottom:8px;background:var(--accent-bg);border-radius:8px;padding:6px 10px">${th.slice(0,15).map(f=>`<div class="sub" style="color:var(--fg)"><span class="code">${esc(f.codigo)}</span> ${esc(f.nome)} · ${esc(f.condicao)}</div>`).join('')}${th.length>15?`<div class="sub">+ ${th.length-15} outras (abra o conteúdo)</div>`:''}</div>`:''}
   <div class="actions"><button class="btn sm" data-cdet="${esc(c.codigo)}">Conteúdo</button>${c.status==='DISPONIVEL'?`<button class="btn sm" data-cemp="${esc(c.codigo)}">Emprestar</button><button class="btn sm" data-ctrf="${esc(c.codigo)}">Transferir</button>`:''}${c.status==='EMPRESTADO'?`<button class="btn sm" data-cdev="${esc(c.codigo)}">Devolver</button>`:''}<button class="btn sm" data-chist="${esc(c.codigo)}">Histórico</button><button class="btn sm danger" data-cdel="${esc(c.codigo)}">Excluir</button></div></div>`).join('')||'<div class="empty">Nada encontrado.</div>'}</div>`};
ACT.caixas=()=>{inputBind('cxBusca','cxBusca');
  $('#newCx').onclick=()=>formModal('Nova caixa',[{k:'codigo',label:'Código / TAG',req:1},{k:'nome',label:'Nome',req:1},{k:'loc',label:'Almoxarifado',type:'select',opts:ALM.L},{k:'cond',label:'Condição',type:'select',opts:COND,val:'Bom'},{k:'obs',label:'Observações'}],'Cadastrar',v=>{if(getF(v.codigo)||getC(v.codigo)||getA(v.codigo))throw new Error('Já existe um item com esse código.');DB.caixas.push({codigo:v.codigo,nome:v.nome,status:'DISPONIVEL',localizacao:v.loc,responsavelAtual:null,dataEmprestimo:null,dataPrevisaoRetorno:null,condicao:v.cond,observacoes:v.obs});addMov({tipo:TM.ENTRADA,itemTipo:'CAIXA',itemCodigo:v.codigo,itemNome:v.nome,responsavel:'Almoxarife',origem:'Entrada / Montagem de Caixa',destino:v.loc,condicao:v.cond,observacoes:v.obs,documentoRef:'CAD-CX-'+v.codigo});commit()});
  bind('[data-cdet]','click',b=>dlgCaixa(b.dataset.cdet));bind('[data-cemp]','click',b=>dlgEmprestar('CAIXA',b.dataset.cemp));bind('[data-cdev]','click',b=>dlgDevolver('CAIXA',b.dataset.cdev));bind('[data-ctrf]','click',b=>dlgTransferir('CAIXA',b.dataset.ctrf));bind('[data-chist]','click',b=>dlgHist(b.dataset.chist));

    const m=modal('Excluir caixa '+c.codigo,`<p style="margin:0">A caixa tem <b>${n}</b> peça(s). O que fazer com elas?</p>`,`<button class="btn" data-x>Cancelar</button><button class="btn" id="e1">Manter como avulsas</button><button class="btn danger" id="e2">Excluir caixa e peças</button>`);

};
function dlgCaixa(cod){

  const m=modal(`${c.codigo} · ${c.nome}`,`<input id="cq" placeholder="Filtrar peças desta caixa (ex.: 9/16)" value="${esc(ui.cxBusca)}"><div id="cxb"></div>`,`<button class="btn" id="doc">Documento de conferência</button><button class="btn pri" data-x>Fechar</button>`,{wide:true,noFocus:true});
  const paint=()=>{m.querySelector('#cxb').innerHTML=draw();m.querySelector('#addT').onclick=()=>{dlgFerr();setTimeout(()=>{const s=$('#f_cx');if(s)s.value=c.codigo},0)};
    m.querySelector('#linkT').onclick=()=>{const av=DB.ferramentas.filter(f=>!f.caixaCodigo&&f.status==='DISPONIVEL');formModal('Vincular peça existente',[{k:'f',label:'Ferramenta avulsa',type:'select',opts:av.map(f=>[f.codigo,`${f.codigo} · ${f.nome}`])}],'Vincular',v=>{const f=getF(v.f);if(!f)throw new Error('Selecione uma ferramenta.');Object.assign(f,{caixaCodigo:c.codigo,localizacao:c.localizacao,status:c.status,responsavelAtual:c.responsavelAtual});addMov({tipo:'VINCULAÇÃO',itemTipo:'FERRAMENTA',itemCodigo:f.codigo,itemNome:f.nome,responsavel:'Almoxarife',origem:f.localizacao+' (Avulsa)',destino:`Caixa ${c.codigo}`,documentoRef:'VINC-'+f.codigo});save();paint()})};

/* ---------- Alugados ---------- */

  CLOUD.cfg=cfg;setStatus('conectando');
  await loadFirebase();if(!firebase.apps.length)firebase.initializeApp(cfg);
  CLOUD.auth=firebase.auth();CLOUD.db=firebase.firestore();
  CLOUD.auth.onAuthStateChanged(u=>{if(u){CLOUD.email=u.email||'';cloudStart()}else{stopListen();CLOUD.email='';setStatus('login')}})}
async function cloudDisconnect(){try{await CLOUD.auth?.signOut()}catch(_){}stopListen();try{localStorage.removeItem('almox_cloud')}catch(_){}CLOUD.cfg=null;CLOUD.db=null;CLOUD.synced={};setStatus('off')}
function cloudCard(){
  if(IN_ARTIFACT)return `<div class="card"><h2>Nuvem</h2><div class="hint">A sincronização com a nuvem funciona na versão instalada do app (GitHub Pages). Nesta página, use o backup em arquivo.</div></div>`;
  const st=CLOUD.status,ok=st==='online'||st==='sincronizando';
  const form=`<label class="f">Configuração do Firebase (firebaseConfig)<textarea id="cfgTxt" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", ... }'>${esc(ui.cfgTxt||'')}</textarea></label><div class="two"><label class="f">E-mail de acesso<input id="cfgEmail" type="email" autocomplete="username" value="${esc(ui.cfgEmail||'')}"></label><label class="f">Senha<input id="cfgPass" type="password" autocomplete="current-password" value="${esc(ui.cfgPass||'')}"></label></div>`;
  return `<div class="card"><h2>Nuvem (Firebase)</h2>
   ${st==='off'?`<p class="sub" style="margin-top:0">Salve os dados na nuvem e compartilhe entre vários aparelhos. Os dados continuam funcionando sem internet e sincronizam quando a conexão volta.</p>${form}<div class="toolbar" style="margin-top:10px"><button class="btn pri" id="cloudConn">Conectar</button></div>`
   :st==='login'?`<p class="sub" style="margin-top:0">Entre com o e-mail e a senha criados no Firebase.</p><div class="two"><label class="f">E-mail<input id="cfgEmail" type="email" autocomplete="username" value="${esc(ui.cfgEmail||CLOUD.email||'')}"></label><label class="f">Senha<input id="cfgPass" type="password" autocomplete="current-password"></label></div><div class="toolbar" style="margin-top:10px"><button class="btn pri" id="cloudLogin">Entrar</button><button class="btn" id="cloudOff">Remover configuração</button></div>`
   :`<div class="toolbar"><span class="pill ${ok?'s-DISPONIVEL':st==='erro'?'s-BAIXADO':'s-EMPRESTADO'}">${{online:'Sincronizado',sincronizando:'Sincronizando…',conectando:'Conectando…',offline:'Sem internet',erro:'Erro'}[st]||st}</span><span class="sub grow">${esc(CLOUD.email)}${CLOUD.last?' · última sincronização '+dtf(CLOUD.last):''}</span></div>${CLOUD.msg?`<div class="err" style="margin-top:8px">${esc(CLOUD.msg)}</div>`:''}<div class="toolbar" style="margin-top:10px"><button class="btn pri" id="cloudSync">Sincronizar agora</button><button class="btn danger" id="cloudOff">Desconectar</button></div>`}
   ${ui.cloudErr?`<div class="err" style="margin-top:8px">${esc(ui.cloudErr)}</div>`:''}</div>`}
function cloudBind(){
  inputBind('cfgTxt','cfgTxt',()=>{});inputBind('cfgEmail','cfgEmail',()=>{});inputBind('cfgPass','cfgPass',()=>{});
  const sign=async(email,pass)=>{try{await CLOUD.auth.signInWithEmailAndPassword(email,pass);ui.cloudErr='';ui.cfgPass=''}catch(e){ui.cloudErr=({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'Usuário não encontrado. Crie o usuário em Authentication no Firebase.','auth/operation-not-allowed':'Ative o login por e-mail/senha no Firebase (Authentication).','auth/unauthorized-domain':'Domínio não autorizado. Adicione este endereço em Authentication > Configurações > Domínios autorizados.','auth/network-request-failed':'Sem conexão com a internet.'})[e.code]||e.message;render()}};
  const c=$('#cloudConn');if(c)c.onclick=async()=>{try{ui.cloudErr='';const cfg=parseCfg(ui.cfgTxt||'');if(!ui.cfgEmail||!ui.cfgPass)throw new Error('Informe e-mail e senha.');
    await cloudInit(cfg);try{localStorage.setItem('almox_cloud',JSON.stringify(cfg))}catch(_){}await sign(ui.cfgEmail,ui.cfgPass)}catch(e){ui.cloudErr=e.message;CLOUD.cfg=null;if(!CLOUD.auth)CLOUD.status='off';render()}};
  const l=$('#cloudLogin');if(l)l.onclick=()=>sign(ui.cfgEmail||CLOUD.email,ui.cfgPass||'');
  const o=$('#cloudOff');if(o)o.onclick=()=>confirmBox('Desconectar da nuvem neste aparelho? Os dados locais continuam aqui.',cloudDisconnect,'Desconectar');
  const y=$('#cloudSync');if(y)y.onclick=async()=>{CLOUD.synced={};stopListen();CLOUD.started=false;await cloudStart();toast('Sincronização concluída')};
}
addEventListener('online',()=>{if(CLOUD.cfg&&CLOUD.db&&CLOUD.auth?.currentUser)cloudStart()});
addEventListener('offline',()=>{if(CLOUD.db)setStatus('offline')});

/* ====================== boot ====================== */
(async()=>{
  try{const t=localStorage.getItem('almox_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  await load();
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h;
  addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;render()}});
  render();
  if(!IN_ARTIFACT){try{const c=JSON.parse(localStorage.getItem('almox_cloud')||'null');if(c)cloudInit(c).catch(e=>setStatus(navigator.onLine?'erro':'offline',e.message))}catch(_){}}
  try{if('wakeLock'in navigator){const lock=()=>navigator.wakeLock.request('screen').catch(()=>{});lock();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()})}}catch(e){}
})();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
